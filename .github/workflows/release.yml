name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          exe=sha256-ready; [ "${{ runner.os }}" = "Windows" ] && exe=sha256-ready.exe
          asset="sha256-ready-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$exe" LICENSE README.md dist/
          tar -czf "$asset" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          cat "$asset.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: |
            sha256-ready-${{ matrix.target }}.tar.gz
            sha256-ready-${{ matrix.target }}.tar.gz.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
