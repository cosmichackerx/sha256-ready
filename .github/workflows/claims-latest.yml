# Weekly: the README must pin the newest release of this repository (a stale pin tells readers to install an old version).
name: README pins vs newest tag

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    name: README pins equal the newest tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cosmichackerx/claims-check@v0.2.0
        with:
          config: .claims-latest.json
