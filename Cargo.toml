[package]
name = "sha256-ready"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Find code that assumes Git object names are 40 characters (SHA-1) before SHA-256 repositories reach your pipeline; plus a sandbox to run scripts against a SHA-256 repo."
license = "MIT"
repository = "https://github.com/cosmichackerx/sha256-ready"
readme = "README.md"
keywords = ["git", "sha256", "lint", "ci", "security"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "=0.4.23" # newer 0.4.x releases use let-chains and fail to build on Rust 1.85
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
